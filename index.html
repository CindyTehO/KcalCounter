<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Step 1: Basic HTML skeleton and meta tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Calorie & Macro Tracker</title>

    <!-- Step 2: Tailwind CSS via CDN for mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Step 3: FontAwesome for icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Step 4: Chart.js for optional visual indicators -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Step 5: SheetJS (xlsx) for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <!-- Step 6: Inline CSS for small custom tweaks (Tailwind handles most styling) -->
    <style>
        /* Ensure the app uses full viewport height and scrolls nicely on mobile */
        body {
            background-color: #0f172a; /* slate-900 */
        }
        /* Simple fade-in animation for sections */
        .fade-in {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Mobile-friendly horizontal scroll for day selector */
        .day-scroll {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="text-slate-100">
<!-- Step 7: Main app container -->
<div class="min-h-screen max-w-md mx-auto px-3 py-4 flex flex-col gap-4">

    <!-- App Header -->
    <header class="flex items-center justify-between mb-2">
        <div>
            <h1 class="text-xl font-semibold">Weekly Calorie & Macro Tracker</h1>
            <p class="text-xs text-slate-400">Mobile-friendly planner • GitHub Pages ready</p>
        </div>
        <button id="exportExcelBtn"
                class="flex items-center gap-1 text-xs bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded-full">
            <i class="fa-solid fa-file-excel"></i>
            <span>Export Week</span>
        </button>
    </header>

    <!-- Step 8: Day selector (Weekly Meal Planner top section) -->
    <section class="bg-slate-800 rounded-xl p-3 shadow-md fade-in">
        <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-calendar-week text-emerald-400"></i>
                Weekly Meal Planner
            </h2>
            <button id="addFoodBtn"
                    class="flex items-center gap-1 text-[11px] bg-sky-500 hover:bg-sky-600 text-white px-2 py-1 rounded-full">
                <i class="fa-solid fa-plus"></i>
                <span>New Food</span>
            </button>
        </div>

        <!-- Horizontal day selector -->
        <div class="flex gap-2 overflow-x-auto day-scroll pb-1 mb-3">
            <!-- Day buttons will be injected here -->
            <div id="daySelector" class="flex gap-2"></div>
        </div>

        <!-- Step 9: Meal cards for the selected day -->
        <div id="mealContainer" class="flex flex-col gap-3"></div>
    </section>

    <!-- Step 10: Daily Nutrition Progress & Targets (bottom section) -->
    <section class="bg-slate-800 rounded-xl p-3 shadow-md fade-in">
        <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-gauge-high text-amber-400"></i>
                Daily Nutrition Progress
            </h2>
            <span id="currentDayLabel" class="text-[11px] text-slate-400"></span>
        </div>

        <!-- Inline-editable target goals -->
        <div class="grid grid-cols-2 gap-2 mb-3 text-[11px]">
            <!-- Each target row: label + editable input -->
            <div class="flex items-center justify-between gap-2">
                <span>Calories (kcal)</span>
                <input id="targetCalories" type="number"
                       class="w-20 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-right text-[11px]"
                       />
            </div>
            <div class="flex items-center justify-between gap-2">
                <span>Protein (g)</span>
                <input id="targetProtein" type="number"
                       class="w-20 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-right text-[11px]"
                       />
            </div>
            <div class="flex items-center justify-between gap-2">
                <span>Carbs (g)</span>
                <input id="targetCarbs" type="number"
                       class="w-20 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-right text-[11px]"
                       />
            </div>
            <div class="flex items-center justify-between gap-2">
                <span>Fats (g)</span>
                <input id="targetFats" type="number"
                       class="w-20 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-right text-[11px]"
                       />
            </div>
            <div class="flex items-center justify-between gap-2">
                <span>Fiber (g)</span>
                <input id="targetFiber" type="number"
                       class="w-20 bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-right text-[11px]"
                       />
            </div>
        </div>

        <!-- Progress bars with visual indicators -->
        <div class="flex flex-col gap-2 text-[11px]" id="progressBars"></div>

        <!-- Optional Chart.js macro overview -->
        <div class="mt-3">
            <canvas id="macroChart" height="120"></canvas>
        </div>
    </section>

    <!-- Step 11: Modal for adding new food items (Open Food Facts + manual fallback) -->
    <div id="foodModal"
         class="fixed inset-0 bg-black/60 flex items-center justify-center z-20 hidden">
        <div class="bg-slate-900 rounded-xl p-4 w-[90%] max-w-sm shadow-lg">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-utensils text-sky-400"></i>
                    Add New Food Item
                </h3>
                <button id="closeFoodModal"
                        class="text-slate-400 hover:text-slate-200 text-xs">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Search section using Open Food Facts -->
            <div class="mb-3 text-[11px]">
                <label class="block mb-1">Search Open Food Facts</label>
                <div class="flex gap-2">
                    <input id="offSearchInput" type="text"
                           placeholder="e.g. Chobani plain yogurt"
                           class="flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                    <button id="offSearchBtn"
                            class="bg-sky-500 hover:bg-sky-600 text-white px-2 py-1 rounded text-[11px]">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <p id="offStatus" class="mt-1 text-[10px] text-slate-400"></p>
            </div>

            <!-- Manual entry fallback / editable fields -->
            <div class="grid grid-cols-2 gap-2 text-[11px] mb-3">
                <div class="col-span-2">
                    <label class="block mb-1">Name</label>
                    <input id="foodNameInput" type="text"
                           class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                </div>
                <div>
                    <label class="block mb-1">Serving Size (g)</label>
                    <input id="foodServingInput" type="number"
                           class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                </div>
                <div>
                    <label class="block mb-1">Calories (kcal)</label>
                    <input id="foodCaloriesInput" type="number"
                           class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                </div>
                <div>
                    <label class="block mb-1">Protein (g)</label>
                    <input id="foodProteinInput" type="number"
                           class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                </div>
                <div>
                    <label class="block mb-1">Carbs (g)</label>
                    <input id="foodCarbsInput" type="number"
                           class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                </div>
                <div>
                    <label class="block mb-1">Fats (g)</label>
                    <input id="foodFatsInput" type="number"
                           class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                </div>
                <div>
                    <label class="block mb-1">Fiber (g)</label>
                    <input id="foodFiberInput" type="number"
                           class="w-full bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]" />
                </div>
            </div>

            <div class="flex justify-end gap-2 text-[11px]">
                <button id="saveFoodBtn"
                        class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1 rounded">
                    <i class="fa-solid fa-check"></i> Save
                </button>
            </div>
        </div>
    </div>

</div>

<!-- Step 12: JavaScript logic for data, rendering, interactions -->
<script>
    // -----------------------------
    // 1. Food database (per 100g)
    // -----------------------------
    // Each item: Name, Serving Size (g/unit), Calories (kcal), Protein (g), Carbs (g), Fats (g), Fiber (g)
    const foodDatabase = [
        { name: "Skinless boneless chicken leg", servingSize: 100, calories: 190, protein: 24, carbs: 0, fats: 10, fiber: 0 },
        { name: "Chobani plain light yogurt", servingSize: 100, calories: 60, protein: 10, carbs: 4, fats: 0.5, fiber: 0 },
        { name: "Low fat dairy milk", servingSize: 100, calories: 50, protein: 3.4, carbs: 5, fats: 1.5, fiber: 0 },
        { name: "Rolled oats", servingSize: 100, calories: 380, protein: 13, carbs: 67, fats: 7, fiber: 10 },
        { name: "Blueberries", servingSize: 100, calories: 57, protein: 0.7, carbs: 14, fats: 0.3, fiber: 2.4 },
        { name: "Golden kiwi", servingSize: 100, calories: 60, protein: 1.2, carbs: 15, fats: 0.5, fiber: 2.5 },
        { name: "Pork loin", servingSize: 100, calories: 210, protein: 26, carbs: 0, fats: 12, fiber: 0 },
        { name: "Minced chicken", servingSize: 100, calories: 165, protein: 22, carbs: 0, fats: 8, fiber: 0 },
        { name: "Minced pork", servingSize: 100, calories: 250, protein: 20, carbs: 0, fats: 20, fiber: 0 },
        { name: "Minced beef", servingSize: 100, calories: 250, protein: 26, carbs: 0, fats: 17, fiber: 0 },
        { name: "Beef slices", servingSize: 100, calories: 220, protein: 24, carbs: 0, fats: 14, fiber: 0 },
        { name: "Salmon sashimi", servingSize: 100, calories: 208, protein: 20, carbs: 0, fats: 13, fiber: 0 },
        { name: "Salmon", servingSize: 100, calories: 208, protein: 20, carbs: 0, fats: 13, fiber: 0 },
        { name: "Green leafy vegetables", servingSize: 100, calories: 25, protein: 2, carbs: 4, fats: 0.3, fiber: 3 },
        { name: "Russet potato", servingSize: 100, calories: 90, protein: 2.5, carbs: 21, fats: 0.1, fiber: 2 },
        { name: "Tiger prawns", servingSize: 100, calories: 99, protein: 20, carbs: 0, fats: 1.5, fiber: 0 },
        { name: "Brown rice", servingSize: 100, calories: 123, protein: 2.7, carbs: 25.6, fats: 1, fiber: 1.8 },
        { name: "White rice", servingSize: 100, calories: 130, protein: 2.4, carbs: 28, fats: 0.3, fiber: 0.4 },
        { name: "Firm tofu", servingSize: 100, calories: 80, protein: 8, carbs: 2, fats: 4.5, fiber: 1 },
        { name: "Tay's brand steamed chicken breast", servingSize: 100, calories: 120, protein: 24, carbs: 0, fats: 2, fiber: 0 },
        { name: "President brand gouda slice", servingSize: 25, calories: 90, protein: 6, carbs: 0.5, fats: 7.5, fiber: 0 },
        { name: "Ayam brand tuna mayonnaise", servingSize: 100, calories: 220, protein: 18, carbs: 2, fats: 16, fiber: 0 },
        { name: "Eggs", servingSize: 50, calories: 70, protein: 6, carbs: 0.5, fats: 5, fiber: 0 },
        { name: "Sourdough slice", servingSize: 40, calories: 90, protein: 3.5, carbs: 17, fats: 1, fiber: 1.5 },
        { name: "Dried cranberries", servingSize: 40, calories: 130, protein: 0.5, carbs: 33, fats: 0.5, fiber: 2 },
        { name: "Pork collar", servingSize: 100, calories: 260, protein: 22, carbs: 0, fats: 19, fiber: 0 },
        { name: "100plus zero 325ml can", servingSize: 325, calories: 0, protein: 0, carbs: 0, fats: 0, fiber: 0 },
        { name: "BSN syntha-6 isolate chocolate", servingSize: 37, calories: 140, protein: 25, carbs: 6, fats: 2, fiber: 1 }
    ];

    // -----------------------------
    // 2. Weekly plan data structure
    // -----------------------------
    const daysOfWeek = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
    const mealTypes = ["Breakfast","Lunch","Dinner","Snack"];

    // weekPlan[day][meal] = array of { foodName, grams }
    const weekPlan = {};
    daysOfWeek.forEach(day => {
        weekPlan[day] = {};
        mealTypes.forEach(meal => {
            weekPlan[day][meal] = [];
        });
    });

    // -----------------------------
    // 3. Target goals (editable)
    // -----------------------------
    const targets = {
        calories: 1700,
        protein: 120,
        carbs: 175,
        fats: 50,
        fiber: 25
    };

    // -----------------------------
    // 4. State: current selected day
    // -----------------------------
    let currentDay = daysOfWeek[0];
    let macroChart = null;

    // -----------------------------
    // 5. Utility: find food by name
    // -----------------------------
    function findFood(name) {
        return foodDatabase.find(f => f.name === name);
    }

    // -----------------------------
    // 6. Utility: compute macros for a meal
    // -----------------------------
    function computeMealTotals(day, meal) {
        const items = weekPlan[day][meal];
        const totals = { calories: 0, protein: 0, carbs: 0, fats: 0, fiber: 0 };
        items.forEach(item => {
            const food = findFood(item.foodName);
            if (!food) return;
            const factor = item.grams / food.servingSize;
            totals.calories += food.calories * factor;
            totals.protein  += food.protein  * factor;
            totals.carbs    += food.carbs    * factor;
            totals.fats     += food.fats     * factor;
            totals.fiber    += food.fiber    * factor;
        });
        return totals;
    }

    // -----------------------------
    // 7. Utility: compute totals for the day
    // -----------------------------
    function computeDayTotals(day) {
        const totals = { calories: 0, protein: 0, carbs: 0, fats: 0, fiber: 0 };
        mealTypes.forEach(meal => {
            const mt = computeMealTotals(day, meal);
            totals.calories += mt.calories;
            totals.protein  += mt.protein;
            totals.carbs    += mt.carbs;
            totals.fats     += mt.fats;
            totals.fiber    += mt.fiber;
        });
        return totals;
    }

    // -----------------------------
    // 8. Render day selector buttons
    // -----------------------------
    function renderDaySelector() {
        const container = document.getElementById("daySelector");
        container.innerHTML = "";
        daysOfWeek.forEach(day => {
            const btn = document.createElement("button");
            btn.textContent = day.slice(0,3);
            btn.className =
                "px-3 py-1 rounded-full text-xs border " +
                (day === currentDay
                    ? "bg-emerald-500 border-emerald-400 text-white"
                    : "bg-slate-900 border-slate-700 text-slate-300");
            btn.onclick = () => {
                currentDay = day;
                renderAll();
            };
            container.appendChild(btn);
        });
    }

    // -----------------------------
    // 9. Render meals for current day
    // -----------------------------
    function renderMeals() {
        const container = document.getElementById("mealContainer");
        container.innerHTML = "";

        mealTypes.forEach(meal => {
            const card = document.createElement("div");
            card.className = "bg-slate-900 rounded-lg p-3 text-xs";

            // Header row: meal name + totals
            const header = document.createElement("div");
            header.className = "flex items-center justify-between mb-2";

            const title = document.createElement("div");
            title.className = "flex items-center gap-2";
            title.innerHTML = `<span class="font-semibold">${meal}</span>`;

            const totals = computeMealTotals(currentDay, meal);
            const totalsEl = document.createElement("div");
            totalsEl.className = "text-[10px] text-slate-400 text-right";
            totalsEl.innerHTML =
                `Cals: ${totals.calories.toFixed(0)} • ` +
                `P: ${totals.protein.toFixed(1)}g • ` +
                `C: ${totals.carbs.toFixed(1)}g • ` +
                `F: ${totals.fats.toFixed(1)}g • ` +
                `Fi: ${totals.fiber.toFixed(1)}g`;

            header.appendChild(title);
            header.appendChild(totalsEl);
            card.appendChild(header);

            // Items list
            const list = document.createElement("div");
            list.className = "flex flex-col gap-2 mb-2";

            weekPlan[currentDay][meal].forEach((item, index) => {
                const row = document.createElement("div");
                row.className = "flex items-center gap-2";

                // Food dropdown
                const select = document.createElement("select");
                select.className =
                    "flex-1 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[11px]";
                foodDatabase.forEach(food => {
                    const opt = document.createElement("option");
                    opt.value = food.name;
                    opt.textContent = food.name;
                    if (food.name === item.foodName) opt.selected = true;
                    select.appendChild(opt);
                });
                select.onchange = (e) => {
                    item.foodName = e.target.value;
                    renderAll();
                };

                // Quantity input
                const qty = document.createElement("input");
                qty.type = "number";
                qty.min = "0";
                qty.value = item.grams;
                qty.className =
                    "w-16 bg-slate-800 border border-slate-700 rounded px-1 py-1 text-[11px] text-right";
                qty.onchange = (e) => {
                    item.grams = parseFloat(e.target.value) || 0;
                    renderAll();
                };

                // Macro summary for this item
                const food = findFood(item.foodName);
                const factor = food ? item.grams / food.servingSize : 0;
                const summary = document.createElement("div");
                summary.className = "text-[10px] text-slate-400 w-28";
                if (food) {
                    summary.innerHTML =
                        `${item.grams}g • ` +
                        `${(food.calories * factor).toFixed(0)}kcal<br>` +
                        `P:${(food.protein * factor).toFixed(1)} C:${(food.carbs * factor).toFixed(1)} F:${(food.fats * factor).toFixed(1)} Fi:${(food.fiber * factor).toFixed(1)}`;
                } else {
                    summary.textContent = "Unknown food";
                }

                // Delete button
                const delBtn = document.createElement("button");
                delBtn.className =
                    "text-[11px] text-red-400 hover:text-red-300 px-1";
                delBtn.innerHTML = `<i class="fa-solid fa-trash-can"></i>`;
                delBtn.onclick = () => {
                    weekPlan[currentDay][meal].splice(index, 1);
                    renderAll();
                };

                row.appendChild(select);
                row.appendChild(qty);
                row.appendChild(summary);
                row.appendChild(delBtn);
                list.appendChild(row);
            });

            card.appendChild(list);

            // Add item button
            const addBtn = document.createElement("button");
            addBtn.className =
                "flex items-center gap-1 text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded";
            addBtn.innerHTML = `<i class="fa-solid fa-plus"></i> Add item`;
            addBtn.onclick = () => {
                // Default new item: first food, 50g
                weekPlan[currentDay][meal].push({
                    foodName: foodDatabase[0].name,
                    grams: 50
                });
                renderAll();
            };

            card.appendChild(addBtn);
            container.appendChild(card);
        });
    }

    // -----------------------------
    // 10. Render progress bars
    // -----------------------------
    function renderProgressBars() {
        const container = document.getElementById("progressBars");
        container.innerHTML = "";

        const totals = computeDayTotals(currentDay);
        document.getElementById("currentDayLabel").textContent =
            `Day: ${currentDay} • Total: ${totals.calories.toFixed(0)} kcal`;

        const metrics = [
            { key: "calories", label: "Calories (kcal)", value: totals.calories, target: targets.calories },
            { key: "protein",  label: "Protein (g)",     value: totals.protein,  target: targets.protein },
            { key: "carbs",    label: "Carbs (g)",       value: totals.carbs,    target: targets.carbs },
            { key: "fats",     label: "Fats (g)",        value: totals.fats,     target: targets.fats },
            { key: "fiber",    label: "Fiber (g)",       value: totals.fiber,    target: targets.fiber }
        ];

        metrics.forEach(m => {
            const row = document.createElement("div");
            row.className = "flex flex-col gap-1";

            const labelRow = document.createElement("div");
            labelRow.className = "flex items-center justify-between";

            const left = document.createElement("div");
            left.className = "flex items-center gap-2";
            left.innerHTML = `<span>${m.label}</span>`;

            const right = document.createElement("div");
            right.className = "flex items-center gap-1 text-[10px]";

            const ratio = `${m.value.toFixed(1)} / ${m.target}`;
            const icon = document.createElement("i");
            const pct = m.target > 0 ? (m.value / m.target) * 100 : 0;

            // Color-coded icon based on progress
            if (pct >= 100) {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (pct >= 70) {
                icon.className = "fa-solid fa-circle-half-stroke text-amber-400";
            } else {
                icon.className = "fa-regular fa-circle text-slate-500";
            }

            right.appendChild(icon);
            const ratioSpan = document.createElement("span");
            ratioSpan.textContent = ratio;
            right.appendChild(ratioSpan);

            labelRow.appendChild(left);
            labelRow.appendChild(right);

            const barOuter = document.createElement("div");
            barOuter.className = "w-full h-2 bg-slate-700 rounded-full overflow-hidden";

            const barInner = document.createElement("div");
            const width = Math.min(100, pct);
            let colorClass = "bg-red-500";
            if (pct >= 100) colorClass = "bg-emerald-500";
            else if (pct >= 70) colorClass = "bg-amber-400";

            barInner.className = `h-2 ${colorClass}`;
            barInner.style.width = width + "%";

            barOuter.appendChild(barInner);

            row.appendChild(labelRow);
            row.appendChild(barOuter);
            container.appendChild(row);
        });

        // Update Chart.js macro overview
        updateMacroChart(totals);
    }

    // -----------------------------
    // 11. Chart.js macro overview
    // -----------------------------
    function updateMacroChart(totals) {
        const ctx = document.getElementById("macroChart").getContext("2d");
        const dataValues = [
            totals.protein.toFixed(1),
            totals.carbs.toFixed(1),
            totals.fats.toFixed(1),
            totals.fiber.toFixed(1)
        ];
        const labels = ["Protein","Carbs","Fats","Fiber"];

        if (macroChart) {
            macroChart.data.datasets[0].data = dataValues;
            macroChart.update();
            return;
        }

        macroChart = new Chart(ctx, {
            type: "bar",
            data: {
                labels,
                datasets: [{
                    label: "Macros (g)",
                    data: dataValues,
                    backgroundColor: [
                        "#22c55e", // protein
                        "#0ea5e9", // carbs
                        "#f97316", // fats
                        "#a855f7"  // fiber
                    ]
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        ticks: { color: "#cbd5f5", font: { size: 10 } },
                        grid: { display: false }
                    },
                    y: {
                        ticks: { color: "#cbd5f5", font: { size: 10 } },
                        grid: { color: "#1e293b" }
                    }
                }
            }
        });
    }

    // -----------------------------
    // 12. Targets: bind inputs
    // -----------------------------
    function bindTargetInputs() {
        const ids = [
            ["targetCalories","calories"],
            ["targetProtein","protein"],
            ["targetCarbs","carbs"],
            ["targetFats","fats"],
            ["targetFiber","fiber"]
        ];
        ids.forEach(([id,key]) => {
            const input = document.getElementById(id);
            input.value = targets[key];
            input.onchange = (e) => {
                targets[key] = parseFloat(e.target.value) || 0;
                renderProgressBars();
            };
        });
    }

    // -----------------------------
    // 13. Food modal logic
    // -----------------------------
    const foodModal = document.getElementById("foodModal");
    const addFoodBtn = document.getElementById("addFoodBtn");
    const closeFoodModal = document.getElementById("closeFoodModal");
    const offSearchBtn = document.getElementById("offSearchBtn");
    const offSearchInput = document.getElementById("offSearchInput");
    const offStatus = document.getElementById("offStatus");

    const foodNameInput = document.getElementById("foodNameInput");
    const foodServingInput = document.getElementById("foodServingInput");
    const foodCaloriesInput = document.getElementById("foodCaloriesInput");
    const foodProteinInput = document.getElementById("foodProteinInput");
    const foodCarbsInput = document.getElementById("foodCarbsInput");
    const foodFatsInput = document.getElementById("foodFatsInput");
    const foodFiberInput = document.getElementById("foodFiberInput");
    const saveFoodBtn = document.getElementById("saveFoodBtn");

    function openFoodModal() {
        // Reset fields
        offStatus.textContent = "";
        offSearchInput.value = "";
        foodNameInput.value = "";
        foodServingInput.value = 100;
        foodCaloriesInput.value = "";
        foodProteinInput.value = "";
        foodCarbsInput.value = "";
        foodFatsInput.value = "";
        foodFiberInput.value = "";
        foodModal.classList.remove("hidden");
    }

    function closeFoodModalFn() {
        foodModal.classList.add("hidden");
    }

    addFoodBtn.onclick = openFoodModal;
    closeFoodModal.onclick = closeFoodModalFn;

    // Open Food Facts search
    offSearchBtn.onclick = async () => {
        const term = offSearchInput.value.trim();
        if (!term) {
            offStatus.textContent = "Please enter a search term.";
            return;
        }
        offStatus.textContent = "Searching Open Food Facts...";
        try {
            const url = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=1`;
            const res = await fetch(url);
            const data = await res.json();
            if (!data.products || data.products.length === 0) {
                offStatus.textContent = "No product found. Please fill in manually.";
                return;
            }
            const p = data.products[0];
            offStatus.textContent = `Loaded: ${p.product_name || "Unnamed product"} (editable below)`;

            // Map nutriments to our fields (per 100g)
            const n = p.nutriments || {};
            foodNameInput.value = p.product_name || term;
            foodServingInput.value = 100;
            foodCaloriesInput.value = n["energy-kcal_100g"] ?? n["energy-kcal"] ?? "";
            foodProteinInput.value = n["proteins_100g"] ?? "";
            foodCarbsInput.value = n["carbohydrates_100g"] ?? "";
            foodFatsInput.value = n["fat_100g"] ?? "";
            foodFiberInput.value = n["fiber_100g"] ?? "";
        } catch (err) {
            offStatus.textContent = "Error contacting Open Food Facts. Please fill in manually.";
        }
    };

    // Save new food item to local database
    saveFoodBtn.onclick = () => {
        const name = foodNameInput.value.trim();
        if (!name) {
            offStatus.textContent = "Name is required.";
            return;
        }
        const serving = parseFloat(foodServingInput.value) || 100;
        const calories = parseFloat(foodCaloriesInput.value) || 0;
        const protein  = parseFloat(foodProteinInput.value)  || 0;
        const carbs    = parseFloat(foodCarbsInput.value)    || 0;
        const fats     = parseFloat(foodFatsInput.value)     || 0;
        const fiber    = parseFloat(foodFiberInput.value)    || 0;

        foodDatabase.push({
            name,
            servingSize: serving,
            calories,
            protein,
            carbs,
            fats,
            fiber
        });

        offStatus.textContent = "Food item saved and added to dropdowns.";
        setTimeout(() => {
            closeFoodModalFn();
            renderAll();
        }, 600);
    };

    // -----------------------------
    // 14. Excel export using SheetJS
    // -----------------------------
    document.getElementById("exportExcelBtn").onclick = () => {
        // Build array-of-arrays for Excel
        const aoa = [];
        // Header row
        aoa.push([
            "Day","Meal","Ingredient Name","Quantity (g)",
            "Calories","Protein","Carbs","Fats","Fiber"
        ]);

        daysOfWeek.forEach(day => {
            mealTypes.forEach(meal => {
                weekPlan[day][meal].forEach(item => {
                    const food = findFood(item.foodName);
                    if (!food) return;
                    const factor = item.grams / food.servingSize;
                    const row = [
                        day,
                        meal,
                        item.foodName,
                        item.grams,
                        (food.calories * factor).toFixed(1),
                        (food.protein * factor).toFixed(1),
                        (food.carbs * factor).toFixed(1),
                        (food.fats * factor).toFixed(1),
                        (food.fiber * factor).toFixed(1)
                    ];
                    aoa.push(row);
                });
            });

            // Daily totals row
            const totals = computeDayTotals(day);
            aoa.push([
                day,
                "Daily Totals",
                "",
                "",
                totals.calories.toFixed(1),
                totals.protein.toFixed(1),
                totals.carbs.toFixed(1),
                totals.fats.toFixed(1),
                totals.fiber.toFixed(1)
            ]);
        });

        const ws = XLSX.utils.aoa_to_sheet(aoa);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Weekly Plan");
        XLSX.writeFile(wb, "weekly_meal_plan.xlsx");
    };

    // -----------------------------
    // 15. Render everything
    // -----------------------------
    function renderAll() {
        renderDaySelector();
        renderMeals();
        renderProgressBars();
    }

    // -----------------------------
    // 16. Initial setup on load
    // -----------------------------
    document.addEventListener("DOMContentLoaded", () => {
        bindTargetInputs();
        renderAll();
    });
</script>
</body>
</html>
