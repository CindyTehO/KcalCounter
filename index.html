<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Calorie & Macro Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
  <div class="app-root">

    <header>
      <h1>Calorie & Macro Tracker</h1>
      <p>Simple Version • All Meals Expanded • Grams Only</p>
    </header>

    <!-- DAY TABS -->
    <div id="dayTabs">
      <button data-day="Mon" class="active">Mon</button>
      <button data-day="Tue">Tue</button>
      <button data-day="Wed">Wed</button>
      <button data-day="Thu">Thu</button>
      <button data-day="Fri">Fri</button>
      <button data-day="Sat">Sat</button>
      <button data-day="Sun">Sun</button>
    </div>

    <!-- MEAL PLANNER -->
    <section id="mealPlanner"></section>

    <!-- DAILY PROGRESS -->
    <section>
      <h2>Daily Progress</h2>
      <table>
        <tr><th>Macro</th><th>Progress</th><th>Target</th></tr>
        <tr><td>Energy (kcals)</td><td id="progEnergy"></td><td>1700</td></tr>
        <tr><td>Protein (g)</td><td id="progProtein"></td><td>120</td></tr>
        <tr><td>Carbs (g)</td><td id="progCarbs"></td><td>175</td></tr>
        <tr><td>Fats (g)</td><td id="progFats"></td><td>50</td></tr>
        <tr><td>Fiber (g)</td><td id="progFiber"></td><td>25</td></tr>
      </table>
    </section>

    <!-- FOOD DATABASE -->
    <section>
      <h2>Food Database</h2>
      <table id="foodTable">
        <tr>
          <th>Name</th><th>Serving</th><th>Kcals</th><th>P</th><th>C</th><th>F</th><th>Fiber</th><th>Remove</th>
        </tr>
      </table>
    </section>

    <!-- SEARCH -->
    <section>
      <h2>Search Online (Open Food Facts)</h2>
      <input id="searchInput" placeholder="Search food name..." />
      <button id="searchBtn">Search</button>
      <table id="searchResults">
        <tr>
          <th>Name</th><th>Kcals</th><th>P</th><th>C</th><th>F</th><th>Fiber</th><th>Add</th>
        </tr>
      </table>
    </section>

    <!-- CUSTOM FOOD -->
    <section>
      <h2>Add Custom Food</h2>
      <input id="customName" placeholder="Name" />
      <input id="customServing" placeholder="Serving (g)" />
      <input id="customKcals" placeholder="Kcals" type="number" />
      <input id="customProtein" placeholder="Protein" type="number" />
      <input id="customCarbs" placeholder="Carbs" type="number" />
      <input id="customFats" placeholder="Fats" type="number" />
      <input id="customFiber" placeholder="Fiber" type="number" />
      <button id="addCustomBtn">Add</button>
    </section>

    <!-- EXPORT -->
    <section>
      <button id="exportBtn">Export Week to Excel</button>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
